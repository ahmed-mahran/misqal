[project]
name = "misqal"
version = "0.1.0"
description = "misqal: fan-out audit and grain-aware evidence for LLM text-to-SQL, with its benchmarks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ahmed Mahran", email = "ahmed.mahran@mashin.io" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "langchain>=1.4",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2",
    "sqlglot>=30.27.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.7.6"]
spark = ["pyspark==3.5.1"]
xbench = [
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
# data/ holds downloaded benchmarks (untrusted): never collect or import from it.
testpaths = ["tests"]
norecursedirs = ["data", "runs", "reference", ".venv"]

[project.urls]
Repository = "https://github.com/ahmed-mahran/misqal"
